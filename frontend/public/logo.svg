<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Habit Go logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16a34a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- subtle inner highlight -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="white" stroke-opacity="0.14" stroke-width="8"/>
  <!-- checkmark -->
  <path d="M 132 272 L 212 348 L 384 172" fill="none" stroke="white" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- progress dots: daily/weekly/monthly -->
  <circle cx="388" cy="116" r="28" fill="white"/>
  <circle cx="388" cy="116" r="12" fill="#22c55e"/>
  <!-- small accent -->
  <circle cx="86" cy="412" r="18" fill="white" opacity="0.18"/>
  <circle cx="428" cy="400" r="10" fill="white" opacity="0.22"/>
</svg>
