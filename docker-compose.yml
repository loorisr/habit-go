services:
  habit-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: habit-go:latest
    container_name: habit-go
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      DB_PATH: ${DB_PATH:-data/habits.db}
      PASSWORD: ${PASSWORD:-}
      # also supported: APP_PASSWORD, HABIT_PASSWORD
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # scratch has no shell/wget -> healthcheck disabled
    # if you need a healthcheck, run it from the host or add a sidecar
    # alternative: test: ["NONE"]
    healthcheck:
      test: ["NONE"]

