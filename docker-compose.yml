services:
  habit-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: habit-go:latest
    container_name: habit-go
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      DB_PATH: ${DB_PATH:-data/habits.db}
      PASSWORD: ${PASSWORD:-}
      # also supported: APP_PASSWORD, HABIT_PASSWORD
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-8080}/api/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

