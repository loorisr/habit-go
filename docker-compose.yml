services:
  habit-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: habit-go:latest
    container_name: habit-go
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      DB_PATH: ${DB_PATH:-data/habits.db}
      PASSWORD: ${PASSWORD:-}
      # also supported: APP_PASSWORD, HABIT_PASSWORD
      # set to true only behind a reverse proxy that sets X-Forwarded-For / X-Forwarded-Proto
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # comma-separated origins allowed to call the API cross-origin (empty = same-origin only)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - habit-data:/app/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/habit-go", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
   habit-data:
     driver: local
